<style>

.op{--cw:var(--ocw)}
.pfp{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:clamp(10px,2.7vh,12px);font-weight:700;text-shadow:0 1px 3px #000}

.dt small{display:block;font-size:10px;font-weight:600}
.dt.pos{color:var(--gold)}.dt.neg{color:#ffb3b3}

.row{position:relative;display:flex;justify-content:center}

.s-r .nm{left:auto;right:100%;margin:0 4px 0 0}.nm:empty{display:none}
.row.hl .c{box-shadow:0 0 0 2px var(--gold),0 0 14px var(--gold)}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.12);transition:.15s}
.slot.tgt{background:#ffd54a55;box-shadow:0 0 0 2px var(--gold),0 0 18px var(--gold)}
.c{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.12);background:linear-gradient(155deg,#fff,#eee7d6);border:1px solid #cfc7b2;box-shadow:0 2px 6px #0008,inset 0 0 0 2px #fff;position:relative;font-weight:800;user-select:none;touch-action:none;transition:transform .18s,box-shadow .18s}
.c b{position:absolute;top:4%;left:9%;font-size:calc(var(--cw)*.34);line-height:1}
.c i{position:absolute;top:calc(var(--cw)*.4);left:9%;font-style:normal;font-size:calc(var(--cw)*.25);line-height:1}
.c u{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:calc(var(--cw)*.56);padding:calc(var(--cw)*.28) 0 0 calc(var(--cw)*.14)}
.c.r{color:var(--red)}.c.k{color:var(--blk)}
.c.back{background:repeating-linear-gradient(45deg,#1e3a8a 0 3px,#2f55c8 3px 6px);border:calc(var(--cw)*.07) solid #fff}
.c.back b,.c.back i,.c.back u{visibility:hidden}
.c.dr{cursor:grab}@media (hover:hover){.c.dr:hover{transform:translateY(-6px);box-shadow:0 10px 18px #000a}}.dragging .c.dr:hover{transform:none;box-shadow:0 2px 6px #0008,inset 0 0 0 2px #fff}
.c.drag{z-index:50;box-shadow:0 18px 30px #000b;transition:none!important;animation:none!important;cursor:grabbing;will-change:transform}
.c.deal{animation:deal .6s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--d)*55ms)}
.c.land{animation:land .35s both}
.box{position:relative;margin:auto;max-width:780px;max-height:92%;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:22px;background:linear-gradient(#000c,#0008);border:1px solid #f5c54266;border-radius:20px;padding:18px 22px;box-shadow:0 20px 60px #000a;animation:pop .5s both;z-index:8}

.box h1{font-size:26px;text-align:center}.sub{text-align:center;opacity:.75;margin:4px 0 8px;font-size:13px}
label{display:block;margin:10px 0 5px;font-size:13px;opacity:.85}
input[type=text]{width:100%;padding:9px;border-radius:10px;border:1px solid #fff3;background:#0008;color:var(--ink);font-size:16px}
.seg{display:flex;gap:8px}.seg button{flex:1}.seg .on{background:var(--gold);color:#2a1d00;font-weight:700}
.go{width:100%;margin-top:14px;padding:12px;font-size:16px}
.rl{font-size:12px;line-height:1.5}.rl p{margin:0 0 6px}.rl b{color:var(--gold)}
.ov{position:fixed;inset:0;background:#000b;z-index:80;display:flex;padding:10px}
.bs{display:flex;align-items:center;font-size:10px;background:#0009;border-radius:99px;padding:1px 8px;margin-top:2px;white-space:nowrap}.bs.ok{background:#1f8a4c}
.bs s{display:inline-block;width:3px;height:3px;border-radius:50%;background:#fff;margin-left:2px;animation:dot 1s infinite}.bs s:nth-child(2){animation-delay:.2s}.bs s:nth-child(3){animation-delay:.4s}
.shuf .c:not(.deal){animation:shf .8s ease-in-out infinite;animation-delay:calc(var(--d)*70ms)}
@keyframes shf{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-35%) rotate(-6deg)}60%{transform:translateY(8%) rotate(5deg)}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.zm{position:fixed;inset:0;z-index:60;background:rgba(4,24,30,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw)*.12);--cw:min(15vh,9.5vw,90px);padding:0 calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px)}

.zr{display:flex;align-items:center;gap:12px}.zl{width:74px;font-size:12px;text-align:right;line-height:1.35}.zl b{display:block;color:var(--gold);font-size:13px}
.zc{display:flex;gap:calc(var(--cw)*.12)}.zm .slot{background:#ffffff14;border:1px dashed #fff3}
.zm{background:none;gap:0;--cw:min(21vh,11vw,100px)}
.zbk{position:absolute;inset:0;background:rgba(6,30,36,.32);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
.zp{position:relative;z-index:1;padding:10px 92px 16px 24px;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 55%,rgba(255,255,255,.14));-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.42);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.5)}
.zp .zt{width:100%;margin-bottom:8px}.zm .slot{background:none;border:0}.zh{--ov:.24}
.cf{position:fixed;top:-14px;width:8px;height:13px;z-index:90;animation:cfall 2.6s linear forwards;pointer-events:none}
.rot{display:none;position:fixed;inset:0;z-index:99;background:#04180f;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;font-size:18px}
.rot span{font-size:70px;display:inline-block;animation:rt 2.2s infinite ease-in-out}
@media (orientation:portrait) and (max-width:820px){.rot{display:flex}}
@keyframes rt{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes deal{from{opacity:0;transform:translate(var(--fx),-260px) rotate(-30deg) scale(.4)}}
@keyframes land{50%{transform:scale(1.18)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes flp{50%{transform:scaleX(0)}}
@keyframes fl{0%{opacity:0;transform:translateY(8px) scale(.6)}15%{opacity:1;transform:scale(1.25)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

<body><div class="rot"><span>📱</span><b>Xoay ngang điện thoại để chơi</b></div><div id="app"></div>
<script>
const S=['♠','♣','♦','♥'],R=r=>({11:'J',12:'Q',13:'K',14:'A'}[r]||r);
const rk=i=>i%13+2,su=i=>i/13|0,red=i=>su(i)>1;
const CN=['Mậu thầu','Đôi','Thú','Sám cô','Sảnh','Thùng','Cù lũ','Tứ quý','Thùng phá sảnh'];
const SP=[['Sảnh rồng',36],['12/13 đồng màu',30],['3 sảnh',18],['3 thùng',18],['5 đôi 1 sám',14],['6 đôi',12]];
const BN=['Bot An','Bot Bình','Bot Cường'],AV=['🧑','🦊','🐼','🐯'],K=759375;
let N=4,name='Bạn',P=[],tot=[],slots=[],pool=[],sel=null,round=0;
const app=document.getElementById('app');
const sortH=a=>[...a].sort((x,y)=>rk(y)-rk(x)||su(x)-su(y));
const cat=v=>v/K|0;

function ev(ids){
 const rs=ids.map(rk),n=rs.length,c={};rs.forEach(r=>c[r]=(c[r]||0)+1);
 const g=Object.entries(c).map(([r,k])=>[+r,k]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
 let tie=g.map(x=>x[0]);
 const fl=n==5&&ids.every(i=>su(i)==su(ids[0]));
 let st=false;
 if(n==5&&g.length==5){const s=[...rs].sort((a,b)=>b-a);
  if(s[0]-s[4]==4){st=true;tie=[s[0]]}else if(s.join()=='14,5,4,3,2'){st=true;tie=[5]}}
 const m=g[0][1];let ct;
 if(st&&fl)ct=8;else if(m==4)ct=7;else if(m==3&&g.length==2)ct=6;else if(fl)ct=5;else if(st)ct=4;
 else if(m==3)ct=3;else if(m==2)ct=g[1][1]==2?2:1;else ct=0;
 return ct*K+tie.reduce((a,x,i)=>a+x*15**(4-i),0);
}
const P5=[];for(let m=0;m<1024;m++){let k=0;for(let j=0;j<10;j++)k+=m>>j&1;if(k==5)P5.push(m)}
const sel13=(h,m)=>h.filter((_,i)=>m>>i&1);
function each(h,cb){
 const C=new Map(),E=m=>{let v=C.get(m);if(v===undefined){v=ev(sel13(h,m));C.set(m,v)}return v};
 for(let a=0;a<13;a++)for(let b=a+1;b<13;b++)for(let c=b+1;c<13;c++){
  const m1=1<<a|1<<b|1<<c,rest=[];
  for(let i=0;i<13;i++)if(!(m1>>i&1))rest.push(i);
  for(const p of P5){let m2=0,m3=0;
   for(let j=0;j<10;j++)if(p>>j&1)m3|=1<<rest[j];else m2|=1<<rest[j];
   if(cb(m1,m2,m3,E))return true}}
 return false;
}
function auto_(h){
 let best,bs=-1;
 each(h,(a,b,c,E)=>{const v1=E(a),v2=E(b),v3=E(c);if(v3<v2||v2<v1)return;
  const s=(1.3*v3+1.1*v2+v1)/K;if(s>bs){bs=s;best=[a,b,c]}});
 return best.map(m=>sortH(sel13(h,m)));
}
function special(h){
 const c={};h.forEach(i=>c[rk(i)]=(c[rk(i)]||0)+1);const cs=Object.values(c);
 if(cs.length==13)return 0;
 const rd=h.filter(red).length;if(rd>=12||rd<=1)return 1;
 const s3=ids=>{const s=ids.map(rk).sort((a,b)=>b-a);return s[0]-s[2]==2&&new Set(s).size==3||s.join()=='14,3,2'};
 const f3=ids=>ids.every(i=>su(i)==su(ids[0]));
 if(each(h,(a,b,c2,E)=>s3(sel13(h,a))&&[4,8].includes(cat(E(b)))&&[4,8].includes(cat(E(c2)))))return 2;
 if(each(h,(a,b,c2,E)=>f3(sel13(h,a))&&[5,8].includes(cat(E(b)))&&[5,8].includes(cat(E(c2)))))return 3;
 if(cs.filter(x=>x==3).length==1&&cs.filter(x=>x==2).length==5)return 4;
 if(cs.reduce((s,x)=>s+(x>>1),0)>=6)return 5;
 return -1;
}
const $=s=>document.querySelector(s);
let arr=[],fresh=false,landed=[],dg=null,T=1,steps=[];
const cardAssetUrl=id=>{const suits=['spades','clubs','diamonds','hearts'],r=rk(id),s=suits[su(id)],rank=r===14?'ace':r===13?'king':r===12?'queen':r===11?'jack':String(r);return 'https://cdn.jsdelivr.net/gh/hhonbo/OpenDecks-Public-Domain-and-CC0-Playing-Cards@main/svg%20cards/card%20fronts/'+s+'/'+encodeURIComponent(rank)+'%20of%20'+s+'.svg'};
const cardBackAssetUrl='https://cdn.jsdelivr.net/gh/hhonbo/OpenDecks-Public-Domain-and-CC0-Playing-Cards@main/svg%20cards/card%20backs/card%20back%20blue.svg';
const cd=(id,x='',at='',d=0)=>{const r=rk(id),s=S[su(id)],back=String(x).includes('back'),src=back?cardBackAssetUrl:cardAssetUrl(id);return`<div class="c asset-card ${red(id)?'r':'k'} ${x}" data-r="${r}" data-suit="${s}" style="--d:${d};--fx:${(d-6)*-14}px" ${at}><img class="card-art" src="${src}" alt="${back?'Mặt sau lá bài':R(r)+' '+s}" draggable="false" loading="eager" onload="this.parentNode.classList.add('asset-loaded')" onerror="this.parentNode.classList.add('asset-failed');this.remove()"><b>${R(r)}</b><i>${s}</i><u>${r>10?R(r):s}</u></div>`};
const sg=x=>x>0?1:x<0?-1:0,fmt=x=>(x>0?'+':'')+x;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TBL='<div class="table"></div>';
const RULES=`<p><b>Cách xếp:</b> 13 lá chia 3 chi: chi 1 (đầu) 3 lá, chi 2 (giữa) 5 lá, chi 3 (cuối) 5 lá. Chi sau phải ≥ chi trước, nếu không là <b>binh lủng</b>. Kéo một lá thả lên lá khác để đổi chỗ.</p>
 <p><b>Thứ tự:</b> Mậu thầu &lt; Đôi &lt; Thú &lt; Sám cô &lt; Sảnh &lt; Thùng &lt; Cù lũ &lt; Tứ quý &lt; Thùng phá sảnh. A-2-3-4-5 là sảnh nhỏ nhất.</p>
 <p><b>Điểm:</b> mỗi chi thắng +1 chi, thua −1 chi (bàn 100/chi). Sập hầm (thắng cả 3 chi) = 6 chi. Binh lủng thua 6 chi cho mỗi người không lủng.</p>
 <p><b>Tới trắng:</b> ${SP.map(s=>`${s[0]} ${s[1]}`).join(' · ')} (chi).</p>`;
function setup(){
 app.innerHTML=TBL+`<div class="box"><div><h1>♠ MẬU BINH ♥</h1><p class="sub">Chơi offline với máy · Luật Zing Play</p>
 <label>Tên của bạn</label><input type="text" value="${escapeHtml(name)}" maxlength="14" oninput="name=this.value">
 <label>Số người chơi</label><div class="seg">${[2,3,4].map(n=>`<button class="${n==N?'on':''}" onclick="N=${n};setup()">${n} người</button>`).join('')}</div>
 <button class="go pri" onclick="start()">Bắt đầu chơi</button></div><div class="rl">${RULES}</div></div>`;
}
function rules(){const o=document.createElement('div');o.className='ov';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML=`<div class="box" style="grid-template-columns:1fr;position:relative;transform:none">${'<div class="rl">'+RULES+'</div>'}<button class="pri" onclick="this.closest('.ov').remove()">Đóng</button></div>`;document.body.appendChild(o)}
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
function boom(){const c=['#f5c542','#ff5c7a','#7ee2a8','#6ab8ff','#fff'];
 for(let i=0;i<40;i++){const d=document.createElement('div');d.className='cf';d.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};animation-delay:${Math.random()*.8}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
function start(){try{fs();screen.orientation.lock('landscape').catch(()=>{})}catch(e){}tot=Array(N).fill(5000);round=0;deal()}
function deal(){
 const d=[...Array(52).keys()];
 for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 P=[...Array(N)].map((_,i)=>{const h=sortH(d.slice(i*13,i*13+13));return{n:i?BN[i-1]:(name.trim()||'Bạn'),av:AV[i],h,sp:special(h)}});
 arr=[...P[0].h];fresh=true;landed=[];zoom=false;botDone=P.map((_,i)=>!i);
 P.forEach((p,i)=>{if(i)setTimeout(()=>{if(P[i]!==p)return;botDone[i]=true;const e=document.getElementById('bs'+i);if(e){e.className='bs ok';e.textContent='✔ Xong';const s=e.closest('.seat');s&&s.classList.remove('shuf')}},2200+i*900+Math.random()*3500)});
 draw();setTimeout(()=>document.querySelectorAll('.c.deal').forEach(e=>e.classList.remove('deal')),1700);
}
let zoom=false,botDone=[];
const zm=v=>{zoom=v;draw()};
function zoomH2(v,lung){
 return `<div class="zm"><div class="zbk" onclick="zm(false)"></div><div class="zp"><div class="zt"><span><b>Xếp bài</b>${lung?'<span class="zw">⚠ Binh lủng</span>':''}</span><div><button onclick="autoMe()">✨ Tự động</button><button class="pri" onclick="zm(false)">Xong</button></div></div><div class="hand zh">${handH(0,'arr',v)}</div></div></div>`;
}
function zoomH(v,lung){
 const L=[[0,3,'Chi trên'],[3,8,'Chi giữa'],[8,13,'Chi dưới']];
 return `<div class="zm"><div class="zt"><span><b>Xếp bài của bạn</b>${lung?'<span class="zw">⚠ Binh lủng</span>':'Kéo thả lá này lên lá khác để đổi chỗ'}</span><div><button onclick="autoMe()">✨ Xếp tự động</button><button class="pri" onclick="zm(false)">Xong</button></div></div>
 ${L.map((r,k)=>`<div class="zr"><div class="zl">${r[2]}<b>${CN[cat(v[k])]}</b></div><div class="zc">${arr.slice(r[0],r[1]).map((id,j)=>{const gi=r[0]+j;return`<div class="slot" data-i="${gi}">${cd(id,'dr'+(landed.includes(gi)?' land':''),`onpointerdown="down(event,${gi})"`,gi)}</div>`}).join('')}</div></div>`).join('')}</div>`;

const POS={2:['b','t'],3:['b','l','r'],4:['b','l','t','r']};
const info=()=>`<div class="info"><b>Mậu Binh</b><br>Bàn: 100 · Ván ${round+1}</div><div class="tr"><button class="ib" onclick="rules()">?</button>${document.documentElement.requestFullscreen?'<button class="ib" onclick="fs()">⛶</button>':''}<button class="ib" onclick="setup()">☰</button></div>`;
const ck=()=>`<label class="ck"><input type="checkbox" ${auto?'checked':''} onchange="setAuto(this.checked)">Tự động so chi</label>`;
function seatH(i,hd){const p=P[i];return`<div class="seat s-${POS[N][i]}${i?' op':''}${i&&!botDone[i]?' shuf':''}"><div class="pfp"><div>${p.n}</div><div class="avs">${p.av}</div><div class="coin" id="k${i}">${tot[i].toLocaleString('en-US')}</div><div class="bd" id="g${i}"></div>${i?`<div class="bs${botDone[i]?' ok':''}" id="bs${i}">${botDone[i]?'✔ Xong':'Đang xếp<s></s><s></s><s></s>'}</div>`:''}<div class="dt" id="d${i}"></div></div><div class="hand">${hd}</div></div>`}
function handH(i,mode,v){
 const p=P[i];
 return[[0,3],[3,8],[8,13]].map((r,k)=>{
  const ids=mode=='arr'?arr.slice(r[0],r[1]):mode=='dealback'?p.h.slice(r[0],r[1]):p.arr[k];
  const cs=ids.map((id,j)=>{const gi=r[0]+j;
   if(mode=='arr')return`<div class="slot" data-i="${gi}">${cd(id,'dr'+(fresh?' deal':landed.includes(gi)?' land':''),`onpointerdown="down(event,${gi})"`,gi)}</div>`;
   return cd(id,(mode=='show'?'':'back')+(mode=='dealback'&&fresh?' deal':''),'',gi)}).join('');
  return`<div class="row" id="rw${i}_${k}"><div class="cards" id="c${i}_${k}">${cs}</div><span class="nm" id="l${i}_${k}">${mode=='arr'?CN[cat(v[k])]:''}</span></div>`}).join('');
}
function draw(){
 const v=[[0,3],[3,8],[8,13]].map(r=>ev(arr.slice(r[0],r[1]))),lung=v[2]<v[1]||v[1]<v[0],sp=P[0].sp;
 app.innerHTML=TBL+info()+P.map((p,i)=>seatH(i,handH(i,i?'dealback':'arr',v))).join('')+
 `<div class="ct ${lung?'warn':sp>=0?'sm':''}" id="ct">${lung?'⚠ BINH LỦNG':sp>=0?'🎉 '+SP[sp][0].toUpperCase():''}</div>
 <div class="bl">${sp>=0?`<button class="pri" onclick="showdown(true)">🎉 Tới trắng</button>`:''}<button onclick="autoMe()">✨ Xếp tự động</button>${ck()}</div>
 <div class="br"><button onclick="zm(true)">🔍 Xếp bài</button><button class="big" onclick="showdown(false)">So Bài</button></div>${zoom?zoomH2(v,lung):''}`;

}
function down(e,i){
 if(dg||e.button>0)return;e.preventDefault();
 dg={i,el:e.currentTarget,x:e.clientX,y:e.clientY,t:null};dg.el.classList.remove('deal','land');dg.el.style.animation='none';dg.el.classList.add('drag');app.classList.add('dragging');

}

 const g=dg;if(!g)return;
 g.el.style.transform=`translate(${e.clientX-g.x}px,${e.clientY-g.y}px) scale(1.12) rotate(${(e.clientX-g.x)/25}deg)`;g.el.style.pointerEvents='none';
 const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');
 if(g.t!==t){g.t&&g.t.classList.remove('tgt');if(t&&+t.dataset.i!==g.i)t.classList.add('tgt');g.t=t}
}

 const g=dg;if(!g)return;dg=null;
 removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);app.classList.remove('dragging');
 const j=g.t?+g.t.dataset.i:-1;
 if(j>=0&&j!==g.i){[arr[g.i],arr[j]]=[arr[j],arr[g.i]];landed=[g.i,j];draw()}
 else{g.t&&g.t.classList.remove('tgt');g.el.classList.remove('drag');g.el.style.transform='';g.el.style.pointerEvents=''}
}
function autoMe(){arr=auto_(P[0].h).flat();landed=[...Array(13).keys()];draw()}

function mkSteps(){
 const z=()=>Array(N).fill(0),pr=f=>{for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)f(a,b,P[a],P[b])};
 const st=[],bd=z();
 // Các cặp có người tới trắng được xử lý riêng; những cặp còn lại vẫn so từng chi bình thường.
 for(const k of [2,1,0]){const d=z();
  pr((a,b,A,B)=>{
   if(A.dc>=0||B.dc>=0)return;
   const x=A.lung||B.lung?(A.lung&&B.lung?0:A.lung?-1:1):sg(A.v[k]-B.v[k]);
   d[a]+=x;d[b]-=x;
  });
  if(d.some(x=>x!==0)||!P.some(p=>p.dc>=0))st.push({t:`So chi ${3-k}`,k,d});
 }
 pr((a,b,A,B)=>{
  if(A.dc>=0||B.dc>=0)return;
  let x=0;
  if(A.lung||B.lung)x=A.lung&&B.lung?0:A.lung?-3:3;
  else{let w=0,l=0;for(let k=0;k<3;k++){if(A.v[k]>B.v[k])w++;else if(A.v[k]<B.v[k])l++;}x=w==3?3:l==3?-3:0;}
  bd[a]+=x;bd[b]-=x;
 });
 if(bd.some(x=>x))st.push({t:'Sập hầm / Binh lủng · nhân đôi',k:-2,d:bd});
 if(P.some(p=>p.dc>=0)){
  const d=z();
  pr((a,b,A,B)=>{
   if(A.dc<0&&B.dc<0)return;
   const pa=A.dc>=0?SP[A.dc][1]:0,pb=B.dc>=0?SP[B.dc][1]:0;
   const x=pa>pb?pa:pb>pa?-pb:0;
   d[a]+=x;d[b]-=x;
  });
  st.push({t:'🎉 Tới trắng!',k:-1,d});
 }
 return st;
}
let si=0,run=[],ready=false,tm=null,auto=true;
function showdown(decl){
 P.forEach((p,i)=>{
  if(i==0){p.arr=(decl||p.sp>=0)?auto_(p.h):[arr.slice(0,3),arr.slice(3,8),arr.slice(8)];p.dc=p.sp}
  else{p.arr=auto_(p.h);p.dc=p.sp}
  p.v=p.arr.map(ev);p.lung=p.dc<0&&(p.v[2]<p.v[1]||p.v[1]<p.v[0]);
 });
 botDone=P.map(()=>true);zoom=false;steps=mkSteps();si=0;run=Array(N).fill(0);ready=false;clearTimeout(tm);
 app.innerHTML=TBL+info()+P.map((p,i)=>seatH(i,handH(i,i?'back':'show'))).join('')+
 `<div class="ct" id="ct">SO BÀI</div><div class="bl">${ck()}</div><div class="br"><button class="big" id="nx" onclick="nextBtn()">So Tiếp</button></div>`;
 tm=setTimeout(()=>{ready=true;go()},900);
}
const adv=()=>si>=steps.length?fin():go();
function nextBtn(){if(ready){clearTimeout(tm);adv()}}
function setAuto(v){auto=v;if(ready&&v){clearTimeout(tm);tm=setTimeout(adv,600)}}
function stepDone(){ready=true;if(auto)tm=setTimeout(adv,1500)}
function showDt(i,x,keep){
 const d=$('#d'+i);d.className='dt '+(x>0?'pos':x<0?'neg':'');
 d.innerHTML=x>0?`+${x*100}<small>(Ăn ${x} Chi)</small>`:x<0?`${x*100}<small>(Thua ${-x} Chi)</small>`:'0<small>(Hòa)</small>';
 d.style.animation='none';void d.offsetWidth;d.style.animation=keep?'pop .4s both':'fl 1.5s both';d.style.opacity=keep?1:'';
}
function go(){
 if(!ready)return;ready=false;clearTimeout(tm);
 const s=steps[si++],ct=$('#ct');ct.textContent=s.t.toUpperCase();ct.style.animation='none';void ct.offsetWidth;ct.style.animation='pop .4s both';
 document.querySelectorAll('.row.hl').forEach(e=>e.classList.remove('hl'));
 const ks=s.k>=0?[s.k]:s.k==-1?[0,1,2]:[];
 ks.forEach(k=>P.forEach((p,i)=>{$(`#rw${i}_${k}`).classList.add('hl');
  if(i)document.querySelectorAll(`#c${i}_${k} .c`).forEach((el,j)=>{el.style.animation=`flp .5s ${j*.08}s`;setTimeout(()=>el.classList.remove('back'),250+j*80)})}));
 setTimeout(()=>{
  ks.forEach(k=>P.forEach((p,i)=>{$(`#l${i}_${k}`).textContent=CN[cat(p.v[k])]}));
  P.forEach((p,i)=>{
   if(s.k<0||s.k===0)$('#g'+i).innerHTML=p.dc>=0?SP[p.dc][0]:p.lung?'Binh lủng':'';
   $('#g'+i).className='bd'+(p.lung?' bad':'');
   run[i]+=s.d[i];showDt(i,s.d[i],false)});
  stepDone();
 },1000);
}
function fin(){
 ready=false;clearTimeout(tm);
 P.forEach((p,i)=>{tot[i]+=run[i]*100;$('#k'+i).textContent=tot[i].toLocaleString('en-US');showDt(i,run[i],true)});
 round++;document.querySelectorAll('.row.hl').forEach(e=>e.classList.remove('hl'));
 const ct=$('#ct');ct.textContent=run[0]>0?'✦ THẮNG! ✦':run[0]<0?'THUA':'HÒA';ct.classList.remove('winfx','losefx');if(run[0]>0)ct.classList.add('winfx');else if(run[0]<0)ct.classList.add('losefx');ct.style.animation='none';void ct.offsetWidth;if(run[0]===0)ct.style.animation='pop .5s both';
 if(run[0]>0)boom();
 const nx=$('#nx');nx.textContent='Ván Mới';nx.onclick=deal;
}
setup();
</script><!-- V4: CDN switch to jsDelivr for asset delivery. Card artwork: OpenDecks CC0 public-domain playing cards. Source: https://github.com/hhonbo/OpenDecks-Public-Domain-and-CC0-Playing-Cards -->
