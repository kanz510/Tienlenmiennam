<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a2615">
    <title>Tiến Lên Miền Nam</title>
    <link rel="stylesheet" href="style.css?v=r31">
<script>
window.__TLV = 'r31';
function tlvCheck() {
    try {
        fetch(location.pathname + '?tlvcheck=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (t) {
                var m = t.match(/__TLV = '(r[0-9]+)'/);
                if (m && m[1] !== window.__TLV && sessionStorage.getItem('tlvTried') !== m[1]) {
                    sessionStorage.setItem('tlvTried', m[1]);
                    location.reload();
                }
            })
            .catch(function () {});
    } catch (e) {}
}
tlvCheck();
// Kiểm tra lại mỗi khi quay lại app (app mở treo qua đợt cập nhật vẫn tự bắt kịp)
document.addEventListener('visibilitychange', function () { if (!document.hidden) tlvCheck(); });
</script>
</head>
<body>

    <!-- Chặn thiết bị không phải điện thoại (máy dọc sẽ tự xoay game 90°) -->
    <div id="blocker">
        <div class="blocker-content">
            <div class="blocker-icon" id="blocker-icon">📱↻</div>
            <h2 id="blocker-title">Đang kiểm tra...</h2>
            <p id="blocker-text"></p>
        </div>
    </div>

    <!-- Game -->
    <div id="game-container" class="hidden">
        <button id="btn-sound" title="Bật/tắt âm thanh">🔊</button>
        <button id="btn-clear-save" title="Xóa ván đã lưu">🗑️</button>

        <!-- Bot Bắc (trên) -->
        <div class="bot-area bot-top">
            <div class="bot-info">
                <div class="avatar">🐻</div>
                <span class="bot-name">Bot Bắc</span>
                <span class="card-count" id="count-top">13</span>
                <span class="money" id="money-top">💰 1000</span>
            </div>
            <div class="bot-cards" id="cards-top"></div>
        </div>

        <!-- Bot Tây (trái) -->
        <div class="bot-area bot-left">
            <div class="bot-info">
                <div class="avatar">🐯</div>
                <span class="bot-name">Bot Tây</span>
                <span class="card-count" id="count-left">13</span>
                <span class="money" id="money-left">💰 1000</span>
            </div>
            <div class="bot-cards" id="cards-left"></div>
        </div>

        <!-- Bàn chơi -->
        <div class="table-area">
            <div id="played-cards"></div>
            <div id="message"></div>
        </div>

        <!-- Bot Đông (phải) -->
        <div class="bot-area bot-right">
            <div class="bot-info">
                <div class="avatar">🦊</div>
                <span class="bot-name">Bot Đông</span>
                <span class="card-count" id="count-right">13</span>
                <span class="money" id="money-right">💰 1000</span>
            </div>
            <div class="bot-cards" id="cards-right"></div>
        </div>

        <!-- Người chơi (dưới) -->
        <div class="player-area">
            <div class="player-cards" id="cards-player"></div>
            <div class="player-bar">
                <button id="btn-new" class="btn-new-game">Ván mới</button>
                <div class="player-info">
                    <div class="avatar">🧑</div>
                    <span class="bot-name">Bạn</span>
                    <span class="card-count" id="count-player">13</span>
                    <span class="money" id="money-player">💰 1000</span>
                </div>
                <div class="timer-box">
                    <span id="timer-text">15</span>s
                </div>
                <div class="controls">
                    <button id="btn-pass" class="btn-pass">Bỏ lượt</button>
                    <button id="btn-play" class="btn-play">Đánh</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay thắng/thua -->
    <div id="overlay" class="hidden">
        <div id="overlay-content">
            <h2 id="overlay-title"></h2>
            <div id="overlay-money"></div>
            <button id="btn-overlay-new">Chơi lại</button>
        </div>
    </div>

    <script src="game.js?v=r31"></script>
</body>
</html>
