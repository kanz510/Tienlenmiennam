<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a2615">
    <title>Tiến Lên Miền Nam</title>
    <link rel="stylesheet" href="style.css?v=r4">
</head>
<body>

    <!-- Chặn PC hoặc màn hình dọc -->
    <div id="blocker">
        <div class="blocker-content">
            <div class="blocker-icon" id="blocker-icon">📱↻</div>
            <h2 id="blocker-title">Đang kiểm tra...</h2>
            <p id="blocker-text"></p>
        </div>
    </div>

    <!-- Game -->
    <div id="game-container" class="hidden">

        <!-- Bot Bắc (trên) -->
        <div class="bot-area bot-top">
            <div class="bot-info">
                <span class="bot-name">Bot Bắc</span>
                <span class="card-count" id="count-top">13</span>
            </div>
            <div class="bot-cards" id="cards-top"></div>
        </div>

        <!-- Bot Tây (trái) -->
        <div class="bot-area bot-left">
            <div class="bot-info">
                <span class="bot-name">Bot Tây</span>
                <span class="card-count" id="count-left">13</span>
            </div>
            <div class="bot-cards" id="cards-left"></div>
        </div>

        <!-- Bàn chơi -->
        <div class="table-area">
            <div id="played-cards"></div>
            <div id="message"></div>
        </div>

        <!-- Bot Đông (phải) -->
        <div class="bot-area bot-right">
            <div class="bot-info">
                <span class="bot-name">Bot Đông</span>
                <span class="card-count" id="count-right">13</span>
            </div>
            <div class="bot-cards" id="cards-right"></div>
        </div>

        <!-- Người chơi (dưới) -->
        <div class="player-area">
            <div class="player-cards" id="cards-player"></div>
            <div class="player-bar">
                <button id="btn-new" class="btn-new-game">Ván mới</button>
                <div class="player-info">
                    <span class="bot-name">Bạn</span>
                    <span class="card-count" id="count-player">13</span>
                </div>
                <div class="timer-box">
                    <span id="timer-text">15</span>s
                </div>
                <div class="controls">
                    <button id="btn-pass" class="btn-pass">Bỏ lượt</button>
                    <button id="btn-play" class="btn-play">Đánh</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay thắng/thua -->
    <div id="overlay" class="hidden">
        <div id="overlay-content">
            <h2 id="overlay-title"></h2>
            <button id="btn-overlay-new">Chơi lại</button>
        </div>
    </div>

    <script src="game.js?v=r4"></script>
</body>
</html>
